name: Unpack site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack bundle
        run: |
          if [ -f bundle.b64 ]; then
            rm -rf vettore && mkdir vettore
            base64 -d bundle.b64 | tar xz -C vettore
            git rm -q bundle.b64
            git add -A
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git commit -m "Unpack Vettore" && git push
          fi
